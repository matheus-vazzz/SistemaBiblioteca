<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Categoria</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" href="../../static/css/estilo.css">
</head>
<body>

    <header>
        <div class="topo">
            <a class="marca" th:href="@{/}">BIBLIOTECA</a>
            <nav>
                <a th:href="@{/livros}">Livros</a>
                <a th:href="@{/autores}">Autores</a>
                <a th:href="@{/categorias}" class="ativo">Categorias</a>
            </nav>
        </div>
    </header>

    <main class="estreito">

        <section class="apresentacao">
            <h1>Cadastrar categoria</h1>
            <p>Preencha os dados abaixo para cadastrar uma nova categoria.</p>
        </section>

        <div class="painel">
            <form th:action="@{/categorias}" th:object="${categoria}" method="post">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" th:field="*{nome}" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input type="text" th:field="*{descricao}" required>
                </div>

                <button type="submit" class="botao botao-principal">Cadastrar</button>
            </form>
        </div>

        <div class="barra-acoes">
            <a class="botao botao-secundario" th:href="@{/categorias}">Ver categorias cadastradas</a>
            <a class="botao botao-secundario" th:href="@{/}">Voltar ao início</a>
        </div>

    </main>

    <footer>
        Sistema de Biblioteca · Spring Boot + Thymeleaf
    </footer>

</body>
</html>
