<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autor cadastrado</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}" href="../../static/css/estilo.css">
</head>
<body>

    <header>
        <div class="topo">
            <a class="marca" th:href="@{/}">BIBLIOTECA</a>
            <nav>
                <a th:href="@{/livros}">Livros</a>
                <a th:href="@{/autores}" class="ativo">Autores</a>
                <a th:href="@{/categorias}">Categorias</a>
            </nav>
        </div>
    </header>

    <main class="estreito">

        <section class="apresentacao">
            <h1>Autor cadastrado</h1>
            <p>O autor foi salvo com sucesso.</p>
        </section>

        <div class="painel">
            <div class="dados dados-coluna">
                <div>
                    <p class="rotulo">Nome</p>
                    <p class="valor" th:text="${autor.nome}">Machado de Assis</p>
                </div>
                <div>
                    <p class="rotulo">Nacionalidade</p>
                    <p class="valor" th:text="${autor.nacionalidade}">Brasileiro</p>
                </div>
                <div>
                    <p class="rotulo">Obra publicada</p>
                    <p class="valor" th:text="${autor.obra}">Dom Casmurro</p>
                </div>
            </div>
        </div>

        <div class="barra-acoes">
            <a class="botao botao-principal" th:href="@{/autores/novo}">Cadastrar outro autor</a>
            <a class="botao botao-secundario" th:href="@{/autores}">Ver autores cadastrados</a>
        </div>

    </main>

    <footer>
        Sistema de Biblioteca · Spring Boot + Thymeleaf
    </footer>

</body>
</html>
